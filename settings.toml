[[serve]]
protocol = "ws"
# Binding to [::] accepts both IPv6 and IPv4 clients on a dual stack host,
# where an IPv4 client shows up as an IPv4-mapped address. A host that does
# not allow that (a container without IPv6, or bindv6only set) needs one
# serve block per family instead, listening on 0.0.0.0 and on [::].
bind_address = "[::]:7777"

# Uncomment to enable secure websocket
#[[serve]]
#protocol = "wss"
#bind_address = "0.0.0.0:7778"
#tls_cert = "/path/to/certs.pem"
#tls_key = "/path/to/privkey.pem"

# Uncomment to enable secure webtransport
#[[serve]]
#protocol = "wt"
#bind_address = "0.0.0.0:1433"
#tls_cert = "/path/to/certs.pem"
#tls_key = "/path/to/privkey.pem"

# Use tls_self to create and use a self-signed certificate.
# This provides no security and should only be used for testing.
#[[serve]]
#protocol = "wt"
#bind_address = "0.0.0.0:1433"
#tls_self = true

[http_proxy]
allowed_hosts = [
  "content.luanti.org",
  "servers.luanti.org",
]
